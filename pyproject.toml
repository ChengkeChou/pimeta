[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# "pimeta" is unregistered on both PyPI and TestPyPI, so the distribution name,
# the import name and the docs all agree: `pip install pimeta` -> `import pimeta`.
# (Plain "pmeta" was taken: an unrelated 1 KB stub registered it in 2020.)
# Source repository: https://github.com/ChengkeChou/pimeta
name = "pimeta"
version = "1.1.0"
description = "Pure-Python meta-analysis: fixed/random-effects, network meta-analysis, meta-regression, publication bias and plots — a faithful port of R's metafor, netmeta and meta."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhou Cheng-ke", email = "chengke_zhou@whu.edu.cn" }]
keywords = [
    "meta-analysis",
    "systematic-review",
    "network-meta-analysis",
    "meta-regression",
    "effect-size",
    "heterogeneity",
    "forest-plot",
    "funnel-plot",
    "metafor",
    "netmeta",
    "statistics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# DataFrame-shaped return values (as_data_frame_*, read_rm5 tables, ...).
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ChengkeChou/pimeta"
Repository = "https://github.com/ChengkeChou/pimeta"
Issues = "https://github.com/ChengkeChou/pimeta/issues"
Changelog = "https://github.com/ChengkeChou/pimeta/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

# The package does NOT ship a py.typed marker: the annotations are informative
# and correct for the public result dataclasses, but the numeric kernel has
# ~55 known inconsistencies that need a dedicated typing pass. Run
# `mypy src/pimeta` to see them; the count is tracked in the CHANGELOG.
# Re-adding py.typed is the goal once that reaches zero.
[tool.mypy]
python_version = "3.10"
files = ["src/pimeta"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
check_untyped_defs = false
no_implicit_optional = true

