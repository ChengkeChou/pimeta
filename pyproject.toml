[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: the repository is called `pmeta`, but the PyPI distribution name must be
# `pmeta-analysis`: plain `pmeta` was registered in 2020 by an unrelated 1 KB
# stub (no releases since) and PyPI names are first-come-first-served.
# The *import* name is `pmeta` — `pip install pmeta-analysis` -> `import pmeta`.
name = "pmeta-analysis"
version = "1.0.0"
description = "Pure-Python meta-analysis: fixed/random-effects, network meta-analysis, meta-regression, publication bias and plots — a faithful port of R's metafor, netmeta and meta."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhou Cheng-ke", email = "chengke_zhou@whu.edu.cn" }]
keywords = [
    "meta-analysis",
    "systematic-review",
    "network-meta-analysis",
    "meta-regression",
    "effect-size",
    "heterogeneity",
    "forest-plot",
    "funnel-plot",
    "metafor",
    "netmeta",
    "statistics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# DataFrame-shaped return values (as_data_frame_*, read_rm5 tables, ...).
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ChengkeChou/pmeta"
Repository = "https://github.com/ChengkeChou/pmeta"
Issues = "https://github.com/ChengkeChou/pmeta/issues"
Changelog = "https://github.com/ChengkeChou/pmeta/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmeta = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
