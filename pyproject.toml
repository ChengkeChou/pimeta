[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# "pimeta" is unregistered on both PyPI and TestPyPI, so the distribution name,
# the import name and the docs all agree: `pip install pimeta` -> `import pimeta`.
# (Plain "pmeta" was taken: an unrelated 1 KB stub registered it in 2020.)
# Source repository: https://github.com/ChengkeChou/pimeta
name = "pimeta"
version = "1.1.2"
description = "Pure-Python meta-analysis: fixed/random-effects, network meta-analysis, meta-regression, publication bias and plots — a faithful port of R's metafor, netmeta and meta."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhou Cheng-ke", email = "chengke_zhou@whu.edu.cn" }]
keywords = [
    "meta-analysis",
    "systematic-review",
    "network-meta-analysis",
    "meta-regression",
    "effect-size",
    "heterogeneity",
    "forest-plot",
    "funnel-plot",
    "metafor",
    "netmeta",
    "statistics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Bayesian inference.  pimeta.bayes is a complete sampler written against numpy,
# so `pimeta[bayes]` installs exactly what `pimeta` installs.  The extra is
# declared anyway: it is how a feature that is deliberately optional gets stated
# rather than implied, and it is where an accelerator would go if one is ever
# wanted, without changing anybody's install command.
bayes = []
# DataFrame-shaped return values (as_data_frame_*, read_rm5 tables, ...) and
# the pandas backend of pimeta.interop.to_frame / tidy / glance / augment.
pandas = ["pandas>=2.0"]
# Further pimeta.interop backends.  None of these are required to analyse data;
# they only change the type of the table/graph/array you get back.
polars = ["polars>=0.20"]
arrow = ["pyarrow>=14"]
sklearn = ["scikit-learn>=1.3"]
statsmodels = ["statsmodels>=0.14"]
xarray = ["xarray>=2023.1"]
networkx = ["networkx>=3.0"]
interop = [
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xarray>=2023.1",
    "networkx>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/ChengkeChou/pimeta"
Repository = "https://github.com/ChengkeChou/pimeta"
Issues = "https://github.com/ChengkeChou/pimeta/issues"
Changelog = "https://github.com/ChengkeChou/pimeta/blob/main/CHANGELOG.md"

[project.scripts]
pimeta = "pimeta.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the marker so downstream mypy/pyright use the inline types.
[tool.setuptools.package-data]
pimeta = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter, not by the linter
    # zip() here always pairs parallel arrays (yi/vi, TE/seTE, study arms)
    # that are built to the same length; adding strict=False at ~120 call
    # sites would be noise that says nothing about intent.
    "B905",
    # O / I / l are the notation of the field (observed counts, inertia,
    # and the R source these functions were ported from).
    "E741",
]

# The source is hand-formatted in a consistent house style; `ruff format`
# would rewrite all 88 files (it disagrees with the `a ** 2` spacing and the
# multi-entry __all__ blocks), so CI runs the linter only.

# The package ships py.typed (PEP 561): `mypy src/pimeta` is clean, and CI
# enforces that it stays that way.
[tool.mypy]
python_version = "3.10"
files = ["src/pimeta"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = false
check_untyped_defs = false
no_implicit_optional = true
show_error_codes = true

