# Hooks that run before every commit.  Install once with:
#
#     pip install pre-commit && pre-commit install
#
# `ruff-check` and `ruff-format` need the ruff binary; if it is unavailable the
# hook is skipped and CI still enforces both.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/api/|docs/reference/r-method-map\.md)
      - id: end-of-file-fixer
        exclude: ^(docs/api/|docs/reference/r-method-map\.md|src/pimeta/py\.typed)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/pimeta/
        additional_dependencies: ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
