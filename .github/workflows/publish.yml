name: Publish to PyPI

# Publishes to PyPI using OIDC Trusted Publishing — no API token stored anywhere.
# Requires a "pending publisher" on PyPI pointing at:
#   Owner              ChengkeChou
#   Repository         pimeta
#   Workflow name      publish.yml
#   Environment        pypi
#
# Trigger it either by publishing a GitHub Release (recommended) or by running
# this workflow manually from the Actions tab. Manual runs default to
# `dry_run: true`, which exercises the full build + test + artifact pipeline but
# stops before uploading - use it to validate a workflow change without
# burning a version number.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only - skip the PyPI upload"
        type: boolean
        default: true

permissions:
  contents: read

# Node 20 was deprecated on GitHub-hosted runners. Every action below is pinned
# to a major release that runs on node24:
#   checkout v5, setup-python v6, upload-artifact v6, download-artifact v7.
# (upload-artifact v5 and download-artifact v5/v6 still use node20.)
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata renders on PyPI
        run: python -m twine check dist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test the installed package
        run: python -c "import pimeta; print('pimeta', pimeta.__version__, '|', len(pimeta.__all__), 'exports'); assert len(pimeta.__all__) == 351"

      - name: Run the test suite
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pimeta/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Show what would be uploaded
        run: ls -l dist/

      - name: Publish
        # Runs on a GitHub Release, and on manual dispatch unless dry_run is set.
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` - the action obtains a short-lived OIDC token from PyPI.
        # No `repository-url:` - defaults to https://upload.pypi.org/legacy/
