name: Publish to PyPI

# Publishes to PyPI using OIDC Trusted Publishing — no API token stored anywhere.
# Requires a "pending publisher" on PyPI pointing at:
#   Owner              ChengkeChou
#   Repository         pimeta
#   Workflow name      publish.yml
#   Environment        pypi
#
# Trigger it either by publishing a GitHub Release (recommended) or by running
# this workflow manually from the Actions tab. A manual run publishes: leave
# `dry_run` unchecked. Tick it only when you want the full build + test +
# artifact pipeline without uploading, e.g. to validate a workflow change
# without burning a version number. The job title and the final log line both
# state which of the two happened, so a dry run can never look like a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaults to false: a manual run of *this* workflow means "release".
        # The build job already runs the full suite and `twine check`, and PyPI
        # refuses a version that already exists, so the worst case of an
        # accidental run is a clear "file already exists" error.  Leaving it
        # true caused two runs that looked green while PyPI received nothing.
        description: "Build and test only - do NOT upload to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

# Node 20 was deprecated on GitHub-hosted runners. Every action below is pinned
# to a major release that runs on node24:
#   checkout v5, setup-python v6, upload-artifact v6, download-artifact v7.
# (upload-artifact v5 and download-artifact v5/v6 still use node20.)
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata renders on PyPI
        run: python -m twine check dist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Check the version matches the release tag
        # A tag of v1.1.0 that builds 1.0.0 would publish the wrong thing (or
        # be rejected by PyPI as a duplicate) with a confusing error, so catch
        # it here instead.  Only meaningful for a real release.
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          assert version == expected, (
              f"release tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Smoke test the installed package
        # Deliberately not an export *count*.  The count grows whenever a module
        # gains a public name, so pinning it turns the next routine feature into
        # a mystery release failure -- which is exactly what a stale `== 351`
        # did.  Assert the invariants instead: every advertised name resolves,
        # none is duplicated, and a real fit still runs end to end.
        run: |
          python - <<'PY'
          import numpy as np

          import pimeta

          bad = [n for n in pimeta.__all__ if not hasattr(pimeta, n)]
          assert not bad, f"{len(bad)} names in __all__ do not resolve: {bad[:10]}"

          dupes = sorted({n for n in pimeta.__all__ if pimeta.__all__.count(n) > 1})
          assert not dupes, f"duplicate entries in __all__: {dupes}"

          r = pimeta.rma([0.2, 0.4, 0.1], vi=[0.04, 0.05, 0.03], method="REML")
          assert np.all(np.isfinite(r.b)), r.b
          assert np.isfinite(r.tau2), r.tau2

          print(f"pimeta {pimeta.__version__} | {len(pimeta.__all__)} exports, "
                f"all resolvable | rma ok "
                f"(b={float(r.b[0]):.4f}, tau2={float(r.tau2):.4g})")
          PY

      - name: Run the test suite
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    # A dry run skips the upload but every step ends "success" or "skipped", so
    # the job shows green while PyPI gets nothing.  Put the mode in the job name
    # so that cannot be misread.
    name: Publish to PyPI${{ (inputs.dry_run == true) && ' (DRY RUN - nothing is uploaded)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pimeta/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Show what would be uploaded
        run: ls -l dist/

      - name: Publish
        # Runs on a GitHub Release, and on manual dispatch unless dry_run is set.
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` - the action obtains a short-lived OIDC token from PyPI.
        # No `repository-url:` - defaults to https://upload.pypi.org/legacy/

      - name: Say what actually happened
        # Runs after both branches, so the log always states whether PyPI was
        # touched.  This is the answer to "the workflow was green but the new
        # version is not on PyPI".
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::warning title=Nothing uploaded::DRY RUN - the upload step was skipped. Re-run this workflow with 'dry_run' unchecked to publish to PyPI."
            exit 0
          fi
          python - <<'PY'
          import pathlib

          # Read the version off the artifacts themselves, not pyproject.toml.
          # This job never checks the repository out -- it only has dist/ -- so
          # reading pyproject.toml here raised FileNotFoundError *after* a
          # successful upload and failed a release that had already happened.
          # The artifact name is also the more honest source: it is literally
          # what was sent to PyPI.
          dist = sorted(p for p in pathlib.Path("dist").iterdir() if p.is_file())
          assert dist, "dist/ is empty - the publish step uploaded nothing"

          def version_of(name):
              # "pimeta-1.1.0-py3-none-any.whl" -> 1.1.0
              # "pimeta-1.1.0.tar.gz"             -> 1.1.0
              for suffix in (".whl", ".tar.gz", ".zip"):
                  if name.endswith(suffix):
                      stem = name[: -len(suffix)]
                      return stem.split("-")[1]
              raise ValueError(f"unrecognised artifact name: {name}")

          names = ", ".join(p.name for p in dist)
          versions = {version_of(p.name) for p in dist}
          assert len(versions) == 1, f"artifacts disagree on the version: {versions}"
          version = versions.pop()

          print(f"::notice title=Uploaded to PyPI::pimeta {version} - {names}")
          print(f"https://pypi.org/project/pimeta/{version}/")
          PY

