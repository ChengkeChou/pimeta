name: CI

# Runs on every push and pull request — the publish workflow only fires on a
# GitHub Release, which is too late to catch a regression.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · py${{ matrix.python }} · numpy${{ matrix.numpy }} · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A full run is about ten minutes, and it goes four times over: once per
        # interpreter.  `tools/shard_tests.py` reads .test_durations.json (a
        # checked-in map of test id to seconds) and cuts the run into equally
        # *timed* quarters rather than equally numbered ones.  Measured locally
        # the four shards took 173, 263, 282 and 203 s against 615 s unsharded,
        # so the critical path is 2.2x shorter; the spread is the cost of a
        # shared setup being paid once per shard, which no static split can see.
        # The combinations are written out rather than crossed, because a GitHub
        # matrix cannot cross a literal list with `include` entries predictably.
        include:
          # Oldest supported interpreter on the NumPy 1.x side of the 2.0 split.
          - { python: "3.10", numpy: "1", shard: 1 }
          - { python: "3.10", numpy: "1", shard: 2 }
          - { python: "3.10", numpy: "1", shard: 3 }
          - { python: "3.10", numpy: "1", shard: 4 }
          - { python: "3.11", numpy: "1", shard: 1 }
          - { python: "3.11", numpy: "1", shard: 2 }
          - { python: "3.11", numpy: "1", shard: 3 }
          - { python: "3.11", numpy: "1", shard: 4 }
          # Current interpreters on NumPy 2.x.
          - { python: "3.12", numpy: "2", shard: 1 }
          - { python: "3.12", numpy: "2", shard: 2 }
          - { python: "3.12", numpy: "2", shard: 3 }
          - { python: "3.12", numpy: "2", shard: 4 }
          - { python: "3.13", numpy: "2", shard: 1 }
          - { python: "3.13", numpy: "2", shard: 2 }
          - { python: "3.13", numpy: "2", shard: 3 }
          - { python: "3.13", numpy: "2", shard: 4 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.numpy }}" = "1" ]; then
            python -m pip install "numpy<2"
          fi
          python -m pip install --editable . pytest pytest-cov

      - name: Show resolved versions
        run: python -c "import sys,numpy,scipy,matplotlib,pimeta; print(sys.version.split()[0], '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| matplotlib', matplotlib.__version__, '| pimeta', pimeta.__version__)"

      - name: Work out which quarter of the suite this shard runs
        # By recorded time rather than by file count: the slowest file is
        # orders of magnitude slower than the fastest, so an equal number of
        # files is an unequal amount of work.
        run: |
          python tools/shard_tests.py --shard ${{ matrix.shard }} --of 4 > shard.txt
          echo "this shard runs $(wc -l < shard.txt) tests"

      - name: Run the test suite with coverage
        # `pipefail` keeps pytest's exit code through the `tee`; the log is
        # needed by the next step because the runner log itself is not
        # readable without a token.
        run: |
          set -o pipefail
          mapfile -t ids < shard.txt
          if [ ${#ids[@]} -eq 0 ]; then
            echo "nothing assigned to this shard"
            exit 0
          fi
          python -m pytest "${ids[@]}" -q --cov=src/pimeta \
            --cov-report=term-missing:skip-covered --cov-report=xml 2>&1 | tee pytest.log

      - name: Surface the failure in the check annotations
        # Turns the pytest log into `::error` annotations, which are readable
        # from the public checks API — the only way to see why a run failed
        # without downloading the (token-only) runner log.
        if: failure()
        run: |
          python - <<'PY'
          import pathlib
          import re

          log = pathlib.Path("pytest.log")
          text = log.read_text(errors="replace") if log.exists() else ""

          failed = [l for l in text.splitlines() if l.startswith(("FAILED ", "ERROR "))]
          for line in failed[:25]:
              print(f"::error title=pytest::{line[:900]}")

          match = re.search(
              r"=+ FAILURES =+(.+?)(?=\n=+ (?:short test summary|warnings summary|slowest))",
              text, re.S)
          if match:
              first = " ".join(match.group(1).split())
              print(f"::error title=first failure::{first[:6000]}")
          elif failed:
              print("::error title=pytest::no FAILURES section captured")

          tail = [l for l in text.splitlines() if re.search(r"\d+ (?:failed|passed)", l)]
          if tail:
              print(f"::error title=pytest summary::{tail[-1][:900]}")
          warnings = re.search(r"=+ warnings summary =+(.+?)(?=\n=+ |\Z)", text, re.S)
          if warnings:
              text_warn = " ".join(warnings.group(1).split())
              print(f"::error title=pytest warnings::{text_warn[:3000]}")

      - name: Upload coverage report
        # Each shard covers a quarter of the suite, so the artefact is named
        # after the shard rather than pretending to be the whole picture.
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml-shard${{ matrix.shard }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade ruff
      - name: Lint
        # `ruff format --check` is deliberately not run: the source is hand
        # formatted in a consistent house style and the formatter would rewrite
        # all 88 files.  See the note in pyproject.toml [tool.ruff.lint].
        run: ruff check src tests tools

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned: a new mypy release is a linter change, not a code change,
          # and it should be adopted deliberately.  numpy/scipy stubs move too,
          # so the range keeps CI deterministic.
          python -m pip install --editable . "mypy>=2.4,<3"
      - name: Type-check the package
        # The package ships py.typed, so this also guards what downstream users
        # see.  The configuration lives in pyproject.toml [tool.mypy].
        run: python -m mypy src/pimeta

  build:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
      - name: Build
        run: python -m build
      - name: Validate metadata and README rendering
        run: python -m twine check dist/*
      - name: Install the wheel and run the shipped example
        run: |
          python -m pip install dist/*.whl
          python examples/bcg_meta_analysis.py
